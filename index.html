<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR code Generator</title>
    <link rel="stylesheet" href="qr.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎯 QR code Generator</h1>
      <p class="subtitle">Quickly create a QR code</p>

      <form id="qrForm">
        <div class="form-group">
          <label for="content">📝 QR code content</label>
          <input
            type="text"
            id="content"
            placeholder="Enter URL, text, or content..."
            required
          />
        </div>

        <div class="form-group">
          <label for="errorCorrection">🛡️ Error Correction Level</label>
          <select id="errorCorrection">
            <option value="L">L - Low (7% auto-recovery)</option>
            <option value="M" selected>
              M - Medium (15% auto-recovery) - Recommended
            </option>
            <option value="Q">Q - Quartile (25% auto-recovery)</option>
            <option value="H">H - High (30% auto-recovery)</option>
          </select>
        </div>

        <div class="form-group">
          <label>📏 QR code size </label>
          <div class="size-container">
            <div>
              <label for="width" style="margin-bottom: 5px">Width (px)</label>
              <input type="text" id="width" value="250" placeholder="width" />
            </div>
            <div>
              <label for="height" style="margin-bottom: 5px">Height (px)</label>
              <input type="text" id="height" value="250" placeholder="height" />
            </div>
          </div>
        </div>

        <button type="submit">✨ Generate QR Code</button>
      </form>

      <div class="qr-output">
        <div class="qr-display" id="qrDisplay">
          <div id="qrcode"></div>
          <div class="button-group">
            <button type="button" class="btn-secondary" id="downloadBtn">
              📥 Download
            </button>
            <button type="button" class="btn-secondary" id="copyBtn">
              📋 Copy 
            </button>
          </div>
        </div>
        <div class="info-box" id="message"></div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="qr.js"></script>
  </body>
</html>
